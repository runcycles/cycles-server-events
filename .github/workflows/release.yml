name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # for Trivy SARIF upload to Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version from POM
        id: version
        run: |
          VERSION=$(sed -n 's/.*<revision>\(.*\)<\/revision>.*/\1/p' pom.xml | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # Build fresh for the release scan, then push this exact local image only
      # if Trivy passes. no-cache + pull keep the moving base image and apk
      # upgrade layer current for the authoritative release artifact.
      - name: Build image (no push, load for scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          no-cache: true
          pull: true
          tags: ghcr.io/runcycles/cycles-server-events:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/runcycles/cycles-server-events:${{ steps.version.outputs.version }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          # In `format: sarif` mode the action builds an all-severities report
          # unless this is set, and `exit-code` can trip on fixable findings the
          # `severity` filter above should exclude. Keep the SARIF upload and
          # the blocking gate aligned on HIGH/CRITICAL.
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container

      - name: Push scanned image
        run: |
          docker push ghcr.io/runcycles/cycles-server-events:${{ steps.version.outputs.version }}
          docker tag ghcr.io/runcycles/cycles-server-events:${{ steps.version.outputs.version }} ghcr.io/runcycles/cycles-server-events:latest
          docker push ghcr.io/runcycles/cycles-server-events:latest
