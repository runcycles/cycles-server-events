name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # for Trivy SARIF upload to Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Extract version from POM
        id: version
        run: |
          VERSION=$(sed -n 's/.*<revision>\(.*\)<\/revision>.*/\1/p' pom.xml | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      # Build fresh for the release scan, then push this exact local image only
      # if Trivy passes. no-cache + pull keep the moving base image and apk
      # upgrade layer current for the authoritative release artifact.
      - name: Build image (no push, load for scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          no-cache: true
          pull: true
          tags: ghcr.io/runcycles/cycles-server-events:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/runcycles/cycles-server-events:${{ steps.version.outputs.version }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          # In `format: sarif` mode the action builds an all-severities report
          # unless this is set, and `exit-code` can trip on fixable findings the
          # `severity` filter above should exclude. Keep the SARIF upload and
          # the blocking gate aligned on HIGH/CRITICAL.
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container

      - name: Push scanned image
        run: |
          docker push ghcr.io/runcycles/cycles-server-events:${{ steps.version.outputs.version }}
          docker tag ghcr.io/runcycles/cycles-server-events:${{ steps.version.outputs.version }} ghcr.io/runcycles/cycles-server-events:latest
          docker push ghcr.io/runcycles/cycles-server-events:latest
