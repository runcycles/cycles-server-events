server.port=7980
spring.application.name=cycles-server-events
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
dispatch.pending.timeout-seconds=5
dispatch.processing.recovery-idle-ms=${DISPATCH_PROCESSING_RECOVERY_IDLE_MS:120000}
dispatch.retry.poll-interval-ms=5000
dispatch.retry.batch-size=${RETRY_BATCH_SIZE:100}
dispatch.http.timeout-seconds=30
dispatch.http.connect-timeout-seconds=5
webhook.secret.encryption-key=${WEBHOOK_SECRET_ENCRYPTION_KEY:}
# CyclesEvidence envelope signing identity (Ed25519, raw 32-byte hex).
# Evaluated only when EVIDENCE_SERVER_ID is set; set BOTH signing values for
# production. Ephemeral signing is development-only and must be explicitly allowed.
cycles.evidence.signing.private-key-hex=${EVIDENCE_SIGNING_PRIVATE_KEY_HEX:}
cycles.evidence.signing.signer-did=${EVIDENCE_SIGNING_SIGNER_DID:}
cycles.evidence.signing.allow-ephemeral=${EVIDENCE_ALLOW_EPHEMERAL_SIGNING_KEY:false}
# CyclesEvidence worker: source queue (fed by cycles-server), BLMOVE reliable-queue timeout, and
# the server_id stamped on emitted envelopes (this server's identity). Blank
# server_id disables the evidence signer; records are not claimed or dead-lettered.
# This worker intentionally gates only on server_id; signing-key config then
# validates a configured keypair or fails unless ephemeral dev mode is allowed.
cycles.evidence.queue.pending-key=${EVIDENCE_PENDING_KEY:evidence:pending}
# In-flight list for the BLMOVE reliable-queue pattern: a claimed record sits
# here until stored (ack) or dead-lettered; orphans are recovered to pending on
# startup, so a crash between claim and store never silently loses an audit record.
cycles.evidence.queue.processing-key=${EVIDENCE_PROCESSING_KEY:evidence:processing}
cycles.evidence.queue.timeout-seconds=${EVIDENCE_POP_TIMEOUT_SECONDS:5}
# Dead-letter queue: a source record that fails to build/sign is LPUSH'd here
# (not dropped) so the audit trail isn't silently lost and it can be replayed.
# Bounded (newest kept) so a flood of failures can't grow Redis unboundedly.
cycles.evidence.queue.failed-key=${EVIDENCE_FAILED_KEY:evidence:failed}
cycles.evidence.queue.failed-max-len=${EVIDENCE_FAILED_MAX_LEN:10000}
cycles.evidence.server-id=${EVIDENCE_SERVER_ID:}
# Durable envelope store (content-addressed by evidence_id). `redis` is the
# default backend (shared with cycles-server, which serves GET /v1/evidence/{id});
# an s3/gcs backend can replace it via store.backend. ttl 0 = no expiry (archival).
cycles.evidence.store.backend=${EVIDENCE_STORE_BACKEND:redis}
cycles.evidence.store.key-prefix=${EVIDENCE_STORE_KEY_PREFIX:evidence:envelope:}
cycles.evidence.store.ttl-seconds=${EVIDENCE_STORE_TTL_SECONDS:0}
dispatch.max-delivery-age-ms=${MAX_DELIVERY_AGE_MS:86400000}
events.retention.event-ttl-days=${EVENT_TTL_DAYS:90}
events.retention.delivery-ttl-days=${DELIVERY_TTL_DAYS:14}
events.retention.cleanup-interval-ms=${RETENTION_CLEANUP_INTERVAL_MS:3600000}
# Scheduler pool: DispatchLoop BLMOVE always holds a thread ~permanently; when
# EVIDENCE_SERVER_ID is set, EvidenceWorker BLMOVE holds a second. Sized to 5 so
# retry and cleanup tasks aren't starved when evidence is enabled.
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:5}
cycles.metrics.tenant-tag.enabled=${CYCLES_METRICS_TENANT_TAG_ENABLED:false}
# Actuators (health, info, prometheus) run on a separate management port.
# This worker has no public HTTP API; do not publish 7980 on an ingress.
# Keep 9980 internal-only and scrape it from Prometheus.
management.server.port=${MANAGEMENT_PORT:9980}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,redis
